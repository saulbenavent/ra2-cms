server {
    # Escucha peticiones HTTP en el puerto 80 dentro del contenedor
    listen 80;
    server_name _;

    # Directorio raíz donde están los archivos de WordPress
    root /var/www/html;
    index index.php;

    # Límite máximo de tamaño para subir archivos en WordPress
    client_max_body_size 64M;

    # Procesa las URLs amigables de WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pasa la ejecución de scripts PHP al servicio 'wordpress' por el puerto 9000
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
